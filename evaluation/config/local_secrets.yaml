# FinanceReasoning Evaluation Configuration
# This file is gitignored - never commit API keys!

# Global evaluation settings
evaluation:
  output_dir: results
  max_cost_usd: 10.0
  max_tokens: null
  stop_on_budget_exceed: false
  concurrency: 2
  retry_attempts: 3
  retry_delay_seconds: 1.0

# Model-specific overrides - ONLY these models will be used
models:
  # Claude Sonnet 4 - Anthropic's model
  claude-sonnet-4:
    provider: anthropic
    model_id: claude-sonnet-4-20250514
    max_tokens: 4096
    temperature: 0.7
